[project]
name = "chagatai-sentence-segmentation"
version = "0.1.0"
description = "Canonical multilingual data pipeline for Chagatai sentence boundary detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0.0",
    "huggingface-hub>=0.28.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=19.0.0",
    "scikit-learn>=1.9.0",
    "stanza>=1.13.0",
    "turkicnlp[all]>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
